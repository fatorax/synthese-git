<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connectez-vous à l'espace collaborateurs SDVB3.">
  <title>Connexion - SDVB3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">SDVB3</a>
      <nav aria-label="Navigation principale">
        <ul class="nav-list">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="connexion.html" aria-current="page">Espace collaborateurs</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Espace collaborateurs</h1>
        <p class="hero-text">
          Connectez-vous pour accéder à vos outils et ressources internes.
        </p>
      </div>
    </section>

    <section class="container section">
      <form class="form" action="#" method="post">
        <h2>Connexion</h2>

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn">Se connecter</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 SDVB3 - Tous droits réservés.</p>
      <p>Réalisé par : Augustin, Denis, Antoine, Romain</p>
    </div>
  </footer>
</body>
</html>
